<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PassVault Extension</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 340px; background: #0b0f17; color: #f8fafc; padding: 16px; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e293b; padding-bottom: 12px; margin-bottom: 12px; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; color: #fff; }
    .brand span { color: #3b82f6; }
    .status-badge { font-size: 10px; background: rgba(59, 130, 246, 0.15); color: #60a5fa; padding: 2px 8px; border-radius: 999px; border: 1px solid rgba(59, 130, 246, 0.3); }
    .search-box { width: 100%; background: #161f30; border: 1px solid #1e293b; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; outline: none; }
    .search-box:focus { border-color: #3b82f6; }
    .current-site-card { background: #111827; border: 1px solid #1e293b; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    .current-site-header { font-size: 11px; text-transform: uppercase; color: #94a3b8; font-weight: 600; margin-bottom: 6px; }
    .site-title { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .autofill-btn { width: 100%; background: #2563eb; color: #fff; border: none; padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .autofill-btn:hover { background: #1d4ed8; }
    .quick-tools { display: flex; gap: 8px; margin-bottom: 12px; }
    .tool-btn { flex: 1; background: #161f30; color: #cbd5e1; border: 1px solid #1e293b; padding: 8px; border-radius: 8px; font-size: 11px; font-weight: 500; cursor: pointer; text-align: center; }
    .tool-btn:hover { background: #1e293b; color: #fff; }
    .footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #1e293b; padding-top: 10px; font-size: 11px; color: #94a3b8; }
    .footer a { color: #60a5fa; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      🛡️ Pass<span>Vault</span>
    </div>
    <div class="status-badge" id="vault-status">Vault Synced</div>
  </div>

  <input type="text" id="ext-search" class="search-box" placeholder="Search saved accounts...">

  <div class="current-site-card" id="current-site-section">
    <div class="current-site-header">Current Tab</div>
    <div class="site-title" id="tab-hostname">Loading tab...</div>
    <button class="autofill-btn" id="btn-autofill">
      ⚡ Autofill Login
    </button>
  </div>

  <div class="quick-tools">
    <button class="tool-btn" id="btn-quick-gen">🎲 Generate Password</button>
    <button class="tool-btn" id="btn-add-account">+ Add Account</button>
  </div>

  <div class="footer">
    <span>PassVault Extension v1.0</span>
    <a href="http://localhost:3000/dashboard" target="_blank" id="open-web-vault">Open Web Vault ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
